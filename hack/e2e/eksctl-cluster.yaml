# eksctl cluster for the e2e tests, rendered by gomplate in eksctl.sh. The
# controller gets its credentials through EKS Pod Identity, using a role that
# run.sh creates beforehand (pod-identity.sh), so the tests can swap its policies.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: {{ .Env.CLUSTER_NAME }}
  region: {{ .Env.REGION }}
  version: "{{ .Env.K8S_VERSION }}"
availabilityZones: [{{ .Env.ZONES }}]
autoModeConfig:
  enabled: false
iam:
  podIdentityAssociations:
    - namespace: kube-system
      serviceAccountName: fsx-csi-controller-sa
      roleARN: {{ .Env.CONTROLLER_ROLE_ARN }}
addons:
  - name: eks-pod-identity-agent
managedNodeGroups:
  - name: ng-linux
    desiredCapacity: {{ .Env.NODE_COUNT }}
    # Pods can't reach IMDS, so the controller must use Pod Identity and the
    # region from AWS_REGION.
    disablePodIMDS: true
    instanceTypes: [{{ .Env.INSTANCE_TYPE }}]
    ssh:
      allow: false
