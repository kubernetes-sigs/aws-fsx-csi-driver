# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: public.ecr.aws/fsx-csi-driver/aws-fsx-csi-driver
  tag: "v1.12.0"
  pullPolicy: IfNotPresent

csidriver:
  fsGroupPolicy: ReadWriteOnceWithFSType

sidecars:
  livenessProbe:
    image:
      repository: public.ecr.aws/csi-components/livenessprobe
      tag: v2.20.0-eksbuild.5
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
  nodeDriverRegistrar:
    image:
      repository: public.ecr.aws/csi-components/csi-node-driver-registrar
      tag: v2.18.0-eksbuild.5
      pullPolicy: IfNotPresent
    logLevel: 2
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
  provisioner:
    image:
      repository: public.ecr.aws/csi-components/csi-provisioner
      tag: v6.4.0-eksbuild.5
      pullPolicy: IfNotPresent
    logLevel: 2
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
  resizer:
    image:
      repository: public.ecr.aws/csi-components/csi-resizer
      tag: v2.3.0-eksbuild.5
      pullPolicy: IfNotPresent
    logLevel: 2
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false

controller:
  mode: controller
  loggingFormat: text
  nodeSelector: {}
  replicaCount: 2
  # PriorityClass assigned to the controller pod. Influences scheduling and
  # preemption order. Defaults to the built-in system-cluster-critical class.
  priorityClassName: system-cluster-critical
  # enableMetrics enables the Prometheus metrics endpoint on the controller.
  # When true, the driver exposes metrics on port 3301.
  enableMetrics: false
  # enablePrometheusAnnotations adds prometheus.io scrape annotations to the controller pod.
  enablePrometheusAnnotations: true
  # serviceMonitor controls creation of Prometheus Operator ServiceMonitor resources.
  # Requires the Prometheus Operator CRDs to be installed.
  serviceMonitor:
    enabled: false
  #If you do want to specify resources, uncomment the following lines, adjust them as necessary
  resources:
    requests:
      cpu: 10m
      memory: 40Mi
    limits:
      memory: 256Mi
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    ## EKS Pod Identity needs no annotation. For IRSA (self-managed Kubernetes), set the role:
    #  eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/fsx-csi-role
    name: fsx-csi-controller-sa
    annotations: {}
  logLevel: 2
  podAnnotations: {}
  # AWS region to use. If not specified then the region will be looked up via the AWS EC2 metadata
  # service.
  # ---
  # region: us-east-1
  region:
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
    - effect: NoExecute
      operator: Exists
      tolerationSeconds: 300
  # Specify the timeout of all calls to the CSI driver.
  timeout: 5m
  # securityContext on the controller pod
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0
  # securityContext on the controller container
  # Setting privileged=false will cause the "delete-access-point-root-dir" controller option to fail
  containerSecurityContext:
    privileged: true
  leaderElectionRenewDeadline: 10s
  leaderElectionLeaseDuration: 15s
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: eks.amazonaws.com/compute-type
                operator: NotIn
                values:
                  - fargate
  podLabels: {}
  # topologySpreadConstraints:
  #  - maxSkew: 1
  #    topologyKey: topology.kubernetes.io/zone
  #    whenUnsatisfiable: ScheduleAnyway
  #  - maxSkew: 1
  #    topologyKey: kubernetes.io/hostname
  #    whenUnsatisfiable: ScheduleAnyway
  topologySpreadConstraints: []
  podDisruptionBudget:
    # Warning: Disabling PodDisruptionBudget may lead to delays in stateful workloads starting due to controller
    # pod restarts or evictions.
    enabled: true
  # Tags added to every AWS resource the controller creates (--extra-tags). Not used to find,
  # filter or isolate resources, and not the cluster tag. A StorageClass extraTags value overrides
  # these for the same key. Neither can override CSIVolumeName, fsx.csi.aws.com/cluster or the
  # clusterTagKey key.
  # ---
  # extraTags:
  #   key1: value1
  #   key2: value2
  extraTags: {}
  # Name of the cluster (--cluster-name). With clusterTagKey set, every file system the controller
  # creates is tagged <clusterTagKey>=<clusterName>. See docs/cluster-tag-isolation.md.
  clusterName: ""
  # Key of the cluster tag (--cluster-tag-key). Empty writes no cluster tag.
  # On EKS with Pod Identity, use the key that matches the eks-cluster-name session tag:
  # clusterTagKey: "eks:eks-cluster-name"
  clusterTagKey: ""
  # --cluster-tag-isolation. Set this to match the IAM policy attached to the controller. The value
  # is a string, and the chart fails to render a value that is not one of these strings.
  #   disable:  no isolation. Tags existing file systems this driver provisioned
  #             fsx.csi.aws.com/cluster=true, and new ones with the cluster tag.
  #   backfill: requires clusterName and clusterTagKey. Tags existing file systems this driver
  #             provisioned, and does not filter.
  #   enforce:  requires clusterName and clusterTagKey. Ignores file systems that lack this
  #             cluster's tag value, and does not backfill.
  clusterTagIsolation: "disable"

node:
  mode: node
  loggingFormat: text
  logLevel: 2
  kubeletPath: /var/lib/kubelet
  # PriorityClass assigned to the node pods. Influences scheduling and
  # preemption order. Defaults to the built-in system-node-critical class.
  priorityClassName: system-node-critical
  # How long NodeUnpublishVolume waits for a normal unmount before escalating to
  # `umount -f`. While waiting, the driver periodically checks whether the target
  # has stopped being a mount point, so a umount(8) that blocks in the kernel
  # after the filesystem is already detached no longer holds the volume's
  # in-flight lock forever. Must be at least 30s. Set to 0 to skip the normal
  # unmount and force immediately. Unset (the default) disables the feature and
  # preserves the plain blocking unmount.
  # ---
  # forcefulUnmountTimeout: 2m
  forcefulUnmountTimeout: ""
  # Additional arguments passed to the fsx-plugin container.
  # ---
  # extraArgs:
  #   - --forceful-unmount-timeout=2m
  extraArgs: []
  # Installs the Lustre client userspace tools on Amazon Linux hosts.
  lustreClientInstaller:
    enabled: false
    image:
      repository: public.ecr.aws/amazonlinux/amazonlinux
      tag: "2023"
      pullPolicy: IfNotPresent
  nodeSelector: {}
  updateStrategy: {}
  #If you do want to specify resources, uncomment the following lines, adjust them as necessary,
  resources:
    requests:
      cpu: 10m
      memory: 40Mi
    limits:
      memory: 256Mi
  dnsPolicy: ClusterFirst
  dnsConfig:
    {}
    # Example config which uses the AWS nameservers
    # dnsPolicy: "None"
    # dnsConfig:
    #   nameservers:
    #     - 169.254.169.253
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    ## The node makes no FSx API calls and needs no IAM role.
    name: fsx-csi-node-sa
    annotations: {}
  healthPort: 9809
  # securityContext on the node pod
  securityContext:
    # The node pod must be run as root to bind to the registration/driver sockets
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0
  env: []
  volumes: []
  volumeMounts: []
  podAnnotations: {}
  tolerateAllTaints: true
  tolerations:
    - operator: Exists
      effect: NoExecute
      tolerationSeconds: 300
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: eks.amazonaws.com/compute-type
            operator: NotIn
            values:
            - fargate
  podLabels: {}

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

nodeComponentOnly: false
# nodeComponentOnly: true
  # Only deploys the node DaemonSet, Skips controller deployment
# nodeComponentOnly: false (default)
  # Deploys both controller and node components, normal full deployment
